<p class="f360-sobrepedido" hidden>Esta talla y color se entrega en <b>5 a 7 días hábiles</b>.</p>
<div class="f360-inmediata" hidden>
  <p class="f360-inm-titulo">✓ Entrega inmediata hoy en <b class="f360-inm-tiendas"></b></p>
  <button type="button" class="f360-inm-boton">Fuxia Gold: apártalo 2 horas</button>
  <div class="f360-inm-flujo" hidden>
    <div class="f360-inm-paso f360-inm-tel">
      <label>Tu teléfono (el de tu cuenta Fuxia)<input type="tel" inputmode="tel" autocomplete="tel" placeholder="55 1234 5678"></label>
      <button type="button" class="f360-inm-enviar">Enviar código</button>
    </div>
    <div class="f360-inm-paso f360-inm-cod" hidden>
      <p class="f360-inm-hola"></p>
      <label class="f360-inm-tienda-label" hidden>Tienda<select class="f360-inm-tienda"></select></label>
      <label>Código<input type="text" inputmode="numeric" maxlength="6" placeholder="6 dígitos" class="f360-inm-codigo"></label>
      <button type="button" class="f360-inm-apartar">Apartar 2 horas</button>
    </div>
    <p class="f360-inm-msg" role="status"></p>
  </div>
</div>
<style>
.f360-inmediata [hidden], .f360-inmediata[hidden], .f360-sobrepedido[hidden] { display: none !important; }
.f360-sobrepedido { margin: 12px 0 0; padding: 10px 14px; border-left: 3px solid #B8966E; background: #fbf7f0; font-size: 14px; color: #4a433a; }
.woocommerce-variation-availability .available-on-backorder { display: none; }   /* Woo's own "bajo pedido" text: replaced by ours */
.f360-inmediata { margin: 18px 0; padding: 14px 16px; border: 1px solid #e6dfd4; border-radius: 6px; background: #fffdf9; font-family: inherit; }
.f360-inm-titulo { margin: 0 0 10px; font-size: 14px; color: #3f6b4f; }
.f360-inm-boton, .f360-inm-enviar, .f360-inm-apartar { height: 42px; padding: 0 16px; border: 1px solid #B8966E; background: #fff; color: #8c6414; cursor: pointer; font-size: 14px; border-radius: 4px; }
.f360-inm-boton:hover, .f360-inm-enviar:hover, .f360-inm-apartar:hover { background: #B8966E; color: #fff; }
.f360-inm-flujo { margin-top: 12px; }
.f360-inm-paso { display: grid; gap: 10px; }
.f360-inm-paso label { display: grid; gap: 4px; font-size: 13px; color: #4a433a; }
.f360-inm-paso input, .f360-inm-paso select { height: 40px; padding: 0 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; }
.f360-inm-msg { margin: 10px 0 0; font-size: 13px; }
.f360-inm-msg.ok { color: #3f6b4f; } .f360-inm-msg.err { color: #9b2c2c; }
</style>
<script>
/* Fuxia 360 · Entrega inmediata + Apártalo 2 horas (Fuxia Gold). STAGING. Fuente: tools/storefront/f360-entrega-inmediata.md */
(function () {
  var ENDPOINT = 'https://faltxpkaicwpnlqaxrdu.supabase.co/functions/v1/f360-store-reserve';   // STAGING
  function api(body) {
    return fetch(ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'No se pudo.'); return j; }); });
  }
  // Tallas en México: el selector de la tienda muestra en /mx/ CENTÍMETROS (23, 24, 25, 25.5…) y una clienta mexicana
  // lee "25" como su talla 25, que es la 38. Aquí los botones muestran la talla mexicana (talla de la tienda − 13:
  // 38 → 25; decisión de Mario 2026-10-03) y el título dice "Talla (México)". Otro script de la tienda reescribe los
  // botones después de cargar (y escondía la 38 = 25.5 cm), por eso se vigilan y se vuelve a poner la talla mexicana
  // y a mostrar la 38. Lo que se compra NO cambia:
  // la talla real sigue en data-co (35–40).
  var MX = { '35': '22', '36': '23', '37': '24', '38': '25', '39': '26', '40': '27' };
  function tallasMexico() {
    var cont = document.querySelector('.fuxia-tallas-botones');
    if (!cont) return;
    var titulo = document.querySelector('.fuxia-tallas-header > span');
    var poner = function () {
      cont.querySelectorAll('.fuxia-talla').forEach(function (t) {
        var mx = MX[t.dataset.co];
        if (mx && t.textContent !== mx) t.textContent = mx;
        if (mx && t.style.display === 'none') t.style.display = '';     // la 38 (25.5 cm) venía escondida en /mx/
      });
      if (titulo && titulo.textContent !== 'Talla (México)') titulo.textContent = 'Talla (México)';
    };
    poner();
    if (window.MutationObserver) new MutationObserver(poner).observe(cont, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ['style'] });
    window.addEventListener('load', poner);
  }
  function init() {
    // "5 a 7 días hábiles" va en todos los países; entrega inmediata y tallas mexicanas solo en México (raíz o /mx/).
    var mexico = !(/^\/[a-z]{2}\//.test(location.pathname) && !/^\/mx\//.test(location.pathname));
    if (mexico) tallasMexico();
    var form = document.querySelector('form.variations_form');
    var box = document.querySelector('.f360-inmediata');
    if (!form || !box || !window.jQuery) return;
    var $ = window.jQuery;
    var anchor = form.querySelector('.single_variation_wrap') || form;
    anchor.parentNode.insertBefore(box, anchor.nextSibling);
    var sobre = document.querySelector('.f360-sobrepedido');
    if (sobre) anchor.parentNode.insertBefore(sobre, box);
    var q = function (s) { return box.querySelector(s); };
    var variation = null, stores = [], phone = '';
    function msg(t, ok) { var m = q('.f360-inm-msg'); m.textContent = t || ''; m.className = 'f360-inm-msg ' + (ok ? 'ok' : 'err'); }
    function reset() { if (sobre) sobre.hidden = true; box.hidden = true; q('.f360-inm-flujo').hidden = true; q('.f360-inm-boton').hidden = false; q('.f360-inm-tel').hidden = false; q('.f360-inm-cod').hidden = true; msg(''); }
    $(form).on('found_variation', function (e, v) {
      variation = v && v.variation_id; reset(); if (!variation) return;
      // 5–7 días hábiles (Mario 2026-10-03; never called "sobre pedido" to the customer): no stock but orderable → Woo marks it "available-on-backorder"
      if (sobre) sobre.hidden = !(v.backorders_allowed && /available-on-backorder/.test(v.availability_html || ''));
      if (!mexico) return;
      var asked = variation;
      api({ action: 'availability', woo_variation_id: variation }).then(function (j) {
        if (asked !== variation) return;                       // the customer changed size meanwhile
        stores = j.stores || [];
        if (!stores.length) return;
        q('.f360-inm-tiendas').textContent = stores.map(function (s) { return s.name; }).join(' · ');
        var sel = q('.f360-inm-tienda'); sel.innerHTML = '';
        stores.forEach(function (s) { var o = document.createElement('option'); o.value = s.location_id; o.textContent = s.name; sel.appendChild(o); });
        q('.f360-inm-tienda-label').hidden = stores.length < 2;
        box.hidden = false;
      }).catch(function () { /* sin disponibilidad: no se muestra nada */ });
    });
    $(form).on('reset_data hide_variation', reset);
    q('.f360-inm-boton').addEventListener('click', function () { q('.f360-inm-flujo').hidden = false; q('.f360-inm-boton').hidden = true; });
    q('.f360-inm-enviar').addEventListener('click', function () {
      phone = q('.f360-inm-tel input').value; msg('Revisando tu cuenta…', true);
      api({ action: 'send_code', phone: phone }).then(function (j) {
        q('.f360-inm-tel').hidden = true; q('.f360-inm-cod').hidden = false;
        q('.f360-inm-hola').textContent = (j.first_name ? '¡Hola, ' + j.first_name + '! ' : '') + (j.test ? 'Modo prueba: escribe el código de prueba.' : 'Te enviamos un código por WhatsApp.');
        msg('');
      }).catch(function (e) { msg(e.message); });
    });
    q('.f360-inm-apartar').addEventListener('click', function () {
      msg('Apartando…', true);
      api({ action: 'reserve', phone: phone, code: q('.f360-inm-codigo').value, woo_variation_id: variation, location_id: q('.f360-inm-tienda').value || (stores[0] && stores[0].location_id) })
        .then(function (j) {
          var hasta = new Date(j.reservation.expires_at).toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' }).replace(/\.$/, '');
          q('.f360-inm-cod').hidden = true;
          msg('¡Listo! Te lo apartamos en ' + j.reservation.store + ' hasta las ' + hasta + ' (2 horas). En la tienda pregunta por tu apartado Fuxia Gold.', true);
        }).catch(function (e) { msg(e.message); });
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
