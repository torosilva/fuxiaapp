<script>
/* Fuxia 360 · Entrega inmediata + Apártalo 2 horas (Fuxia Gold). STAGING. Fuente: tools/storefront/f360-entrega-inmediata.md */
(function () {
  var ENDPOINT = 'https://faltxpkaicwpnlqaxrdu.supabase.co/functions/v1/f360-store-reserve';   // STAGING
  function api(body) {
    return fetch(ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'No se pudo.'); return j; }); });
  }
  // Tallas en México: el selector de la tienda muestra en /mx/ CENTÍMETROS (23, 24, 25, 25.5…) y una clienta mexicana
  // lee "25" como su talla 25, que es la 38. Aquí los botones muestran la talla mexicana (talla de la tienda − 13:
  // 38 → 25; decisión de Mario 2026-10-03) y el título dice "Talla (México)". Otro script de la tienda reescribe los
  // botones después de cargar (y escondía la 38 = 25.5 cm), por eso se vigilan y se vuelve a poner la talla mexicana
  // y a mostrar la 38. Lo que se compra NO cambia:
  // la talla real sigue en data-co (35–40).
  var MX = { '35': '22', '36': '23', '37': '24', '38': '25', '39': '26', '40': '27' };
  function tallasMexico() {
    var cont = document.querySelector('.fuxia-tallas-botones');
    if (!cont) return;
    var titulo = document.querySelector('.fuxia-tallas-header > span');
    var poner = function () {
      cont.querySelectorAll('.fuxia-talla').forEach(function (t) {
        var mx = MX[t.dataset.co];
        if (mx && t.textContent !== mx) t.textContent = mx;
        if (mx && t.style.display === 'none') t.style.display = '';     // la 38 (25.5 cm) venía escondida en /mx/
      });
      if (titulo && titulo.textContent !== 'Talla (México)') titulo.textContent = 'Talla (México)';
    };
    poner();
    if (window.MutationObserver) new MutationObserver(poner).observe(cont, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ['style'] });
    window.addEventListener('load', poner);
  }

  // "¿No encontraste tu color y talla? Lo hacemos a la medida" (Mario 2026-10-03): Hilo (HiloLabs) asks color, size or
  // foot length, name and WhatsApp, and leaves a request for the team in Fuxia 360. No price, no payment here.
  function aLaMedida(mexico) {
    var cta = document.querySelector('.f360-medida'), w = document.querySelector('.f360-hilo');
    if (!cta || !w) return;
    var form = document.querySelector('form.variations_form');
    var anchor = form && (form.querySelector('.single_variation_wrap') || form);
    if (anchor) anchor.parentNode.insertBefore(cta, anchor.nextSibling);
    document.body.appendChild(w);
    var log = w.querySelector('.f360-hilo-log'), chips = w.querySelector('.f360-hilo-chips'), input = w.querySelector('.f360-hilo-in input');
    var titulo = (document.querySelector('h1') || {}).textContent || document.title.split('–')[0];
    var producto = String(titulo).trim();
    var d = {}, paso = 0;
    var tallas = mexico ? ['22', '23', '24', '25', '26', '27'] : ['35', '36', '37', '38', '39', '40'];
    function decir(t, quien) { var p = document.createElement('p'); p.className = quien || 'h'; p.textContent = t; log.appendChild(p); log.scrollTop = log.scrollHeight; }
    function opciones(xs) { chips.innerHTML = ''; (xs || []).forEach(function (x) { var b = document.createElement('button'); b.type = 'button'; b.textContent = x; b.onclick = function () { responder(x); }; chips.appendChild(b); }); }
    var PASOS = [
      function () { decir('¡Hola! Soy Hilo 💛 Hacemos tus ' + producto + ' a la medida. ¿Qué color te gustaría?'); opciones([]); input.placeholder = 'Ej. verde olivo'; },
      function () { decir('¡Me encanta! ¿Qué talla usas' + (mexico ? ' (talla mexicana)' : '') + '? Si no la sabes, mide tu pie en centímetros.'); opciones(tallas.concat(['Mido mi pie'])); input.placeholder = mexico ? 'Ej. 24' : 'Ej. 37'; },
      function () { decir('¿Cuántos centímetros mide tu pie, del talón a la punta del dedo más largo?'); opciones([]); input.placeholder = 'Ej. 24.5'; },
      function () { decir('¿Cómo te llamas?'); opciones([]); input.placeholder = 'Tu nombre'; },
      function () { decir('¿A qué WhatsApp te escribimos para darte precio y tiempo?'); opciones([]); input.placeholder = '55 1234 5678'; input.type = 'tel'; },
      function () { decir('¿Algo más que quieras contarnos? (tacón, ocasión, fecha…)'); opciones(['No, así está bien']); input.placeholder = 'Opcional'; input.type = 'text'; }
    ];
    function siguiente(n) { paso = n; PASOS[n](); input.value = ''; input.focus(); }
    function enviar() {
      opciones([]); decir('Un momento…');
      var tallaTienda = d.size && mexico ? String(Number(d.size) + 13) : d.size;
      api({ action: 'a_la_medida', phone: d.phone, name: d.name, color: d.color, size: d.size ? d.size + (mexico ? ' MX' : '') : '',
            store_size: tallaTienda && /^(3[5-9]|40)$/.test(tallaTienda) ? tallaTienda : '', foot_cm: d.foot || '', note: d.note || '',
            woo_product_id: form ? form.getAttribute('data-product_id') : '', product_name: producto, country: mexico ? 'mx' : (location.pathname.split('/')[1] || ''),
            website: w.querySelector('.f360-hp').value })
        .then(function () { decir('¡Listo, ' + d.name + '! Carolina te escribe por WhatsApp para darte precio y tiempo de tus ' + producto + ' en color ' + d.color + '. 💛'); paso = 99; input.disabled = true; })
        .catch(function (e) { decir(e.message); siguiente(4); });
    }
    function responder(t) {
      t = String(t || '').trim(); if (!t && paso !== 5) return;
      decir(t || '—', 'c');
      if (paso === 0) { d.color = t; siguiente(1); }
      else if (paso === 1) { if (/mid/i.test(t)) siguiente(2); else { d.size = t.replace(/[^0-9.]/g, ''); siguiente(3); } }
      else if (paso === 2) { d.foot = t.replace(',', '.').replace(/[^0-9.]/g, ''); siguiente(3); }
      else if (paso === 3) { d.name = t; siguiente(4); }
      else if (paso === 4) { if (t.replace(/\D/g, '').length < 10) { decir('¿Me lo pasas a 10 dígitos?'); return; } d.phone = t; siguiente(5); }
      else if (paso === 5) { d.note = /^no, así está bien$/i.test(t) ? '' : t; enviar(); }
    }
    w.querySelector('.f360-hilo-in').addEventListener('submit', function (e) { e.preventDefault(); responder(input.value); });
    cta.querySelector('.f360-med-abrir').addEventListener('click', function () { w.hidden = false; if (!log.childNodes.length) siguiente(0); else input.focus(); });
    w.querySelector('.f360-hilo-x').addEventListener('click', function () { w.hidden = true; });
  }
  // Reseñas: while a model has 0 reviews the block ("0,0 · Basado en 0 reseñas") is hidden — it hurts more than it helps.
  function ocultarResenasVacias() {
    var revisar = function () {
      var r = document.getElementById('reviews');
      if (r && /Basado en 0 reseñas|0 de 0 reseñas/i.test(r.textContent)) r.style.setProperty('display', 'none', 'important');
    };
    revisar(); window.addEventListener('load', revisar);
    if (window.MutationObserver) { var mo = new MutationObserver(revisar); mo.observe(document.body, { childList: true, subtree: true }); setTimeout(function () { mo.disconnect(); }, 8000); }
  }
  function init() {
    // "5 a 7 días hábiles" va en todos los países; entrega inmediata y tallas mexicanas solo en México (raíz o /mx/).
    var mexico = !(/^\/[a-z]{2}\//.test(location.pathname) && !/^\/mx\//.test(location.pathname));
    var pais = (location.pathname.match(/^\/[a-z]{2}\//) || ['/'])[0];         // keep the country: /mx/… or /co/…
    document.querySelectorAll('.f360-cambios-link').forEach(function (a) { a.href = pais + 'cambios/'; });
    if (mexico) tallasMexico();
    ocultarResenasVacias();
    aLaMedida(mexico);
    var form = document.querySelector('form.variations_form');
    var box = document.querySelector('.f360-inmediata');
    if (!form || !box || !window.jQuery) return;
    var $ = window.jQuery;
    var anchor = form.querySelector('.single_variation_wrap') || form;
    anchor.parentNode.insertBefore(box, anchor.nextSibling);
    var sobre = document.querySelector('.f360-sobrepedido');
    if (sobre) anchor.parentNode.insertBefore(sobre, box);
    var q = function (s) { return box.querySelector(s); };
    // Stock line (CRO-5a, Mario 2026-10-04): NO quantitative scarcity ("3 disponibles", "último par", "quedan X") unless
    // Fuxia 360 says every location behind the online ATS is certified (opening count / cutover). Fail closed: any
    // stock text with a number stays hidden until the answer is {reliable:true}. Texts without numbers (e.g. "Agotado")
    // are untouched. Woo's "(puede reservarse)" is always removed (the 5–7 días line says it).
    var contarOk = false;
    var limpiarStock = function () {
      form.querySelectorAll('.woocommerce-variation-availability .stock').forEach(function (el) {
        var t = el.textContent.replace(/\s*\(puede reservarse\)/i, '');
        if (t !== el.textContent) el.textContent = t;
        var conNumero = /\d|[úu]ltimo par|quedan/i.test(t);   // numbers or scarcity wording
        if (conNumero && !contarOk) el.style.setProperty('display', 'none', 'important'); else el.style.removeProperty('display');
      });
    };
    if (window.MutationObserver) new MutationObserver(limpiarStock).observe(form, { childList: true, subtree: true, characterData: true });
    var variation = null, stores = [], phone = '';
    function msg(t, ok) { var m = q('.f360-inm-msg'); m.textContent = t || ''; m.className = 'f360-inm-msg ' + (ok ? 'ok' : 'err'); }
    function reset() { if (sobre) sobre.hidden = true; box.hidden = true; q('.f360-inm-envio').hidden = true; q('.f360-inm-probar').hidden = true; q('.f360-inm-flujo').hidden = true; q('.f360-inm-boton').hidden = false; q('.f360-inm-tel').hidden = false; q('.f360-inm-cod').hidden = true; msg(''); }
    $(form).on('found_variation', function (e, v) {
      variation = v && v.variation_id; reset(); if (!variation) return;
      // 5–7 días hábiles (Mario 2026-10-03; never called "sobre pedido" to the customer): no stock but orderable → Woo marks it "available-on-backorder"
      var bajoPedido = !!(v.backorders_allowed && /available-on-backorder/.test(v.availability_html || ''));
      contarOk = false; limpiarStock();
      var preguntado = variation;
      api({ action: 'scarcity', woo_variation_id: variation }).then(function (j) {
        if (preguntado !== variation) return;
        contarOk = j && j.reliable === true; limpiarStock();
      }).catch(function () { /* sin respuesta: el número sigue oculto */ });

      if (sobre) sobre.hidden = !bajoPedido;
      if (!mexico) return;
      // Entrega (Mario 2026-10-03): stores are warehouses too, so "in stock" = Bodega CDMX or any store. 8 a. m.–7 p. m.
      // (CDMX time) → "Entrega inmediata en Zona Metropolitana"; later → tomorrow from 8 a. m. Try-on in a store is offered too.
      if (v.is_in_stock && !bajoPedido) {
        var h = Number(new Date().toLocaleString('en-US', { timeZone: 'America/Mexico_City', hour: 'numeric', hour12: false })) % 24;
        q('.f360-inm-envio-t').textContent = h >= 8 && h < 19 ? '🛵 Entrega inmediata en Zona Metropolitana' : '🛵 Entrega mañana a partir de las 8 a. m. en Zona Metropolitana';
        q('.f360-inm-envio').hidden = false; box.hidden = false;
      }
      var asked = variation;
      api({ action: 'availability', woo_variation_id: variation }).then(function (j) {
        if (asked !== variation) return;                       // the customer changed size meanwhile
        stores = j.stores || [];
        if (!stores.length) return;
        q('.f360-inm-tiendas').textContent = stores.map(function (s) { return s.name; }).join(' · ');
        var sel = q('.f360-inm-tienda'); sel.innerHTML = '';
        stores.forEach(function (s) { var o = document.createElement('option'); o.value = s.location_id; o.textContent = s.name; sel.appendChild(o); });
        q('.f360-inm-tienda-label').hidden = stores.length < 2;
        q('.f360-inm-probar').hidden = false; box.hidden = false;
      }).catch(function () { /* sin disponibilidad: no se muestra nada */ });
    });
    $(form).on('reset_data hide_variation', reset);
    q('.f360-inm-boton').addEventListener('click', function () { q('.f360-inm-flujo').hidden = false; q('.f360-inm-boton').hidden = true; });
    q('.f360-inm-enviar').addEventListener('click', function () {
      phone = q('.f360-inm-tel input').value; msg('Revisando tu cuenta…', true);
      api({ action: 'send_code', phone: phone }).then(function (j) {
        q('.f360-inm-tel').hidden = true; q('.f360-inm-cod').hidden = false;
        q('.f360-inm-hola').textContent = (j.first_name ? '¡Hola, ' + j.first_name + '! ' : '') + (j.test ? 'Modo prueba: escribe el código de prueba.' : 'Te enviamos un código por WhatsApp.');
        msg('');
      }).catch(function (e) { msg(e.message); });
    });
    q('.f360-inm-apartar').addEventListener('click', function () {
      msg('Apartando…', true);
      api({ action: 'reserve', phone: phone, code: q('.f360-inm-codigo').value, woo_variation_id: variation, location_id: q('.f360-inm-tienda').value || (stores[0] && stores[0].location_id) })
        .then(function (j) {
          var hasta = new Date(j.reservation.expires_at).toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' }).replace(/\.$/, '');
          q('.f360-inm-cod').hidden = true;
          msg('¡Listo! Te lo apartamos en ' + j.reservation.store + ' hasta las ' + hasta + ' (2 horas). En la tienda pregunta por tu apartado Fuxia Gold.', true);
        }).catch(function (e) { msg(e.message); });
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
