<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=390,height=844">
<title>Fuxia Kids · lanzamiento (maqueta)</title>
<!-- Maqueta para Carolina (Mario 2026-10-24): productos dibujados, no reales. Lo dibuja window.render(t) cuadro por cuadro (render.mjs). -->
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Cormorant+Garamond:wght@600&display=block" rel="stylesheet">
<style>
  :root { --rosa:#F7A8C8; --rosa2:#FF6FA8; --lila:#C9B6F2; --oro:#E8C46A; --oro2:#B8966E; --tinta:#3B2A4A; --crema:#FFF7FB; }
  * { box-sizing:border-box; margin:0; padding:0 }
  html,body { width:390px; height:844px; overflow:hidden; background:#2A1840 }
  #stage { position:relative; width:390px; height:844px; overflow:hidden; font-family:Fredoka, system-ui, sans-serif; color:#fff }
  #sky { position:absolute; inset:0; width:390px; height:844px }
  .layer { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center }
  .brand { font-family:"Cormorant Garamond", serif; letter-spacing:.32em; font-size:30px; color:var(--oro) }
  .kids { font-weight:700; font-size:92px; line-height:.9; letter-spacing:.02em; color:#fff;
          text-shadow:0 5px 0 var(--rosa2), 0 10px 0 #9B3C78, 0 18px 30px rgba(0,0,0,.35) }
  .pill { display:inline-block; padding:9px 18px; border-radius:999px; background:rgba(255,255,255,.16); border:2px solid rgba(255,255,255,.5);
          font-weight:600; font-size:16px; letter-spacing:.08em }
  .hud { position:absolute; top:22px; left:18px; right:18px; display:flex; justify-content:space-between; align-items:center; font-weight:700; font-size:18px }
  .hud .stars { padding:8px 14px; border-radius:16px; background:rgba(42,24,64,.55); border:2px solid var(--oro) }
  .card { width:104px; height:150px; border-radius:22px; background:var(--crema); display:flex; flex-direction:column; align-items:center; justify-content:center;
          gap:6px; color:var(--tinta); font-weight:600; font-size:13px; box-shadow:0 10px 0 rgba(0,0,0,.12) }
  .card.sel { outline:5px solid var(--oro); outline-offset:3px }
  .pop { position:absolute; font-weight:700; font-size:30px; color:var(--oro); text-shadow:0 3px 0 #8A5A1E }
  .h2 { font-weight:700; font-size:34px; line-height:1.05; text-shadow:0 4px 0 rgba(0,0,0,.18) }
  .coupon { width:300px; border-radius:26px; background:var(--crema); color:var(--tinta); padding:22px; border:3px dashed var(--rosa2) }
  .coupon b { display:block; font-size:62px; color:var(--rosa2); line-height:1 }
  .mark { position:absolute; bottom:14px; left:0; right:0; text-align:center; font-size:11px; letter-spacing:.12em; opacity:.6 }
  svg { overflow:visible }
</style></head>
<body><div id="stage"><canvas id="sky" width="780" height="1688"></canvas><div id="ui"></div>
<div class="mark">MAQUETA · PRODUCTOS DE EJEMPLO</div></div>
<script>
// Everything is a pure function of t (seconds), so every frame is reproducible.
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const ease = (x) => 1 - Math.pow(1 - x, 3);
const back = (x) => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const rnd = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

function shoe(body, trim, bow, w = 120) {   // a drawn ballerina flat (example, not a real product)
  return `<svg width="${w}" height="${w * .58}" viewBox="0 0 120 70">
    <ellipse cx="60" cy="62" rx="50" ry="6" fill="rgba(0,0,0,.12)"/>
    <path d="M8 46 C8 28 30 22 52 26 C70 29 84 20 100 24 C114 28 116 46 108 54 C96 62 30 64 14 58 C9 56 8 52 8 46Z" fill="${body}"/>
    <path d="M30 30 C46 40 72 38 92 27 C84 46 44 48 30 30Z" fill="${trim}" opacity=".95"/>
    <path d="M8 50 C30 60 92 60 110 50" stroke="rgba(0,0,0,.15)" stroke-width="3" fill="none"/>
    <g transform="translate(60 33)"><path d="M0 0 L-13 -8 L-13 8Z M0 0 L13 -8 L13 8Z" fill="${bow}"/><circle r="4" fill="${bow}"/></g>
  </svg>`;
}
const SHOES = [
  { n: 'Estrellita', b: '#FF8DBB', t: '#FFD3E6', w: '#E8C46A' },
  { n: 'Luna', b: '#C9B6F2', t: '#EEE6FF', w: '#FF6FA8' },
  { n: 'Brillo', b: '#E8C46A', t: '#FFF1C4', w: '#FF6FA8' },
];

function sky(t) {
  const c = document.getElementById('sky'), g = c.getContext('2d'); g.setTransform(2, 0, 0, 2, 0, 0);
  const warm = prog(t, 17.5, 20);
  const grd = g.createLinearGradient(0, 0, 0, 844);
  grd.addColorStop(0, warm ? `rgb(${42 + 200 * warm},${24 + 140 * warm},${64 + 150 * warm})` : '#2A1840');
  grd.addColorStop(.55, '#6B2F7A'); grd.addColorStop(1, '#FF8DBB');
  g.fillStyle = grd; g.fillRect(0, 0, 390, 844);
  for (let i = 0; i < 70; i++) {           // twinkling stars
    const x = rnd(i) * 390, y = rnd(i + 99) * 600, s = .8 + rnd(i + 7) * 2.2;
    g.globalAlpha = .35 + .65 * Math.abs(Math.sin(t * (1 + rnd(i + 3) * 2) + i)); g.fillStyle = '#fff';
    g.beginPath(); g.arc(x, y, s, 0, 7); g.fill();
  }
  g.globalAlpha = 1;
  // floating hills
  g.fillStyle = 'rgba(255,255,255,.12)';
  g.beginPath(); g.moveTo(0, 844); for (let x = 0; x <= 390; x += 10) g.lineTo(x, 740 + Math.sin(x / 50 + t * .6) * 14); g.lineTo(390, 844); g.fill();
}

function starPath(g, x, y, r, rot = 0) {
  g.beginPath(); for (let k = 0; k < 10; k++) { const a = rot + k * Math.PI / 5 - Math.PI / 2, rr = k % 2 ? r * .45 : r; g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } g.closePath();
}
function bigStars(t, a, b, n = 18) {        // falling gold stars over the sky (game scene)
  if (t < a || t > b) return;
  const g = document.getElementById('sky').getContext('2d');
  for (let i = 0; i < n; i++) {
    const sp = 140 + rnd(i) * 160, x = 30 + rnd(i + 40) * 330, y = ((t - a) * sp + rnd(i + 80) * 900) % 900 - 60;
    g.fillStyle = '#FFD86B'; g.strokeStyle = '#B8862E'; g.lineWidth = 2;
    starPath(g, x, y, 11 + rnd(i + 5) * 7, t * 2 + i); g.fill(); g.stroke();
  }
}
function sparkle(t, x, y, a) {              // burst of sparkles at (x,y) starting at a
  const p = prog(t, a, a + .9); if (!p || p >= 1) return '';
  let s = ''; for (let i = 0; i < 10; i++) { const ang = i / 10 * 6.283, d = ease(p) * 70;
    s += `<div style="position:absolute;left:${x + Math.cos(ang) * d}px;top:${y + Math.sin(ang) * d}px;font-size:${18 - p * 10}px;opacity:${1 - p}">✦</div>`; }
  return s;
}

function render(t) {
  sky(t); bigStars(t, 12.6, 17.6);
  const ui = document.getElementById('ui'); let h = '';
  const fade = (a, b, f = .4) => Math.min(prog(t, a, a + f), 1 - prog(t, b - f, b));

  // 0–3.2 s: "Fuxia Ballerinas presenta"
  let o = fade(0.2, 3.2);
  if (o > 0) h += `<div class="layer" style="opacity:${o}"><div class="brand" style="transform:translateY(${(1 - ease(prog(t, .2, 1.2))) * 20}px)">FUXIA BALLERINAS</div>
    <div class="pill" style="margin-top:18px;opacity:${prog(t, 1, 1.6)}">presenta…</div></div>`;

  // 3–7 s: FUXIA KIDS title, game style
  o = fade(3, 7.2);
  if (o > 0) {
    const s = back(prog(t, 3.1, 3.9)), bob = Math.sin(t * 3) * 6;
    h += `<div class="layer" style="opacity:${o}">
      <div class="brand" style="font-size:24px">FUXIA</div>
      <div class="kids" style="transform:scale(${s}) translateY(${bob}px) rotate(${-4 + Math.sin(t * 2) * 2}deg)">KIDS</div>
      <div class="pill" style="margin-top:34px;opacity:${prog(t, 4.6, 5.1)};transform:scale(${.9 + .1 * Math.abs(Math.sin(t * 4))})">▶ PLAYER 1 · ¡LISTA!</div>
      <div style="margin-top:22px;display:flex;gap:4px;opacity:${prog(t, 5.2, 5.8)}">${SHOES.map((x, i) => `<div style="transform:translateY(${Math.sin(t * 3 + i) * 8}px)">${shoe(x.b, x.t, x.w, 96)}</div>`).join('')}</div>
      ${sparkle(t, 195, 360, 3.8)}</div>`;
  }

  // 7–12.8 s: choose your ballerinas (+100 stars)
  o = fade(7, 12.8);
  const sel = t < 8.8 ? -1 : t < 10.2 ? 0 : t < 11.6 ? 1 : 2;
  const pts = Math.round(100 * ([8.8, 10.2, 11.6].filter((x) => t >= x).length));
  if (o > 0) {
    h += `<div class="layer" style="opacity:${o};justify-content:flex-start;padding-top:120px">
      <div class="h2">Elige tus<br>ballerinas</div>
      <div style="display:flex;gap:12px;margin-top:40px">${SHOES.map((x, i) => `<div class="card ${sel === i ? 'sel' : ''}" style="transform:translateY(${(1 - ease(prog(t, 7.3 + i * .25, 8 + i * .25))) * 300}px) scale(${sel === i ? 1.08 : 1})">${shoe(x.b, x.t, x.w, 88)}<span>${x.n}</span></div>`).join('')}</div>
      <div style="margin-top:46px;font-size:18px;opacity:.9">Cada par que eliges suma estrellas</div></div>`;
    [8.8, 10.2, 11.6].forEach((a, i) => { const p = prog(t, a, a + 1); if (p > 0 && p < 1) h += `<div class="pop" style="left:${80 + i * 116}px;top:${210 - ease(p) * 70}px;opacity:${1 - p * p};z-index:5">+100 ⭐</div>` + sparkle(t, 95 + i * 116, 320, a); });
  }

  // 12.6–17.8 s: mini game, catch the stars
  o = fade(12.6, 17.8);
  const caught = Math.round(300 + 550 * ease(prog(t, 12.8, 17.2)));
  if (o > 0) {
    const x = 195 + Math.sin(t * 2.4) * 120;
    h += `<div class="layer" style="opacity:${o};justify-content:flex-start;padding-top:96px">
      <div class="h2">¡Atrapa las estrellas!</div>
      <div class="pill" style="margin-top:14px">NIVEL ${t < 15.2 ? 1 : 2}</div></div>
      <div style="position:absolute;left:${x - 70}px;top:660px;opacity:${o};transform:rotate(${Math.cos(t * 2.4) * -8}deg)">${shoe(SHOES[0].b, SHOES[0].t, SHOES[0].w, 140)}</div>
      ${t > 15.1 && t < 16 ? `<div class="layer" style="opacity:${1 - prog(t, 15.5, 16)}"><div class="kids" style="font-size:54px;transform:scale(${back(prog(t, 15.1, 15.5))})">¡NIVEL 2!</div></div>` : ''}
      ${[13.4, 14.1, 14.9, 15.8, 16.5].map((a) => sparkle(t, x, 670, a)).join('')}`;
  }

  // 17.8–21.6 s: stars become a discount for mom
  o = fade(17.8, 21.8);
  if (o > 0) {
    const flip = ease(prog(t, 18.9, 19.7));
    h += `<div class="layer" style="opacity:${o}">
      <div class="h2" style="color:var(--tinta);text-shadow:none">Tus estrellas<br>se vuelven…</div>
      <div class="coupon" style="margin-top:28px;transform:perspective(600px) rotateY(${(1 - flip) * 90}deg) scale(${.8 + .2 * flip})">
        <div style="font-size:15px;letter-spacing:.14em;color:var(--oro2)">CUPÓN PARA MAMÁ</div><b>10%</b>
        <div style="font-size:16px;margin-top:6px">en tus ballerinas Fuxia Kids</div>
        <div style="font-size:12px;margin-top:10px;opacity:.6">Ejemplo · el premio real lo define Fuxia</div></div>
      ${sparkle(t, 60, 330, 19.7)}${sparkle(t, 330, 360, 20)}${sparkle(t, 195, 640, 20.3)}</div>`;
  }

  // 21.6–25 s: end card
  o = prog(t, 21.6, 22.1);
  if (o > 0) h += `<div class="layer" style="opacity:${o}">
      <div class="brand" style="color:var(--tinta)">FUXIA</div>
      <div class="kids" style="font-size:78px;transform:scale(${back(prog(t, 21.6, 22.3))})">KIDS</div>
      <div class="h2" style="margin-top:30px;color:var(--tinta);text-shadow:none;font-size:28px">Juega · Elige · Gana</div>
      <div class="pill" style="margin-top:22px;background:var(--tinta);border-color:var(--tinta)">Muy pronto en fuxiaballerinas.com</div></div>`;

  if (t > 3.2 && t < 21.6) h += `<div class="hud"><span>FUXIA KIDS</span><span class="stars">⭐ ${t < 12.6 ? pts : t < 17.8 ? caught : 850}</span></div>`;
  ui.innerHTML = h;
}
window.render = render; window.DURATION = 25;
render(new URLSearchParams(location.search).has('t') ? +new URLSearchParams(location.search).get('t') : 5);
</script></body></html>
