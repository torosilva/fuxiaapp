<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=390,height=844">
<title>Fuxia Kids · su primer par (maqueta)</title>
<!-- Maqueta para Carolina (Mario 2026-10-24): una niña entra con su mamá a la tienda Fuxia y encuentra sus primeras ballerinas.
     Ilustración en siluetas, sin música. Fotos de muestra de la tienda en lugar de los productos Kids. render.mjs tienda.html -->
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&family=Montserrat:wght@500&display=block" rel="stylesheet">
<style>
  :root { --noche:#17151C; --noche2:#24202B; --oro:#C9A86F; --oro2:#E9D3A2; --marfil:#FBF5EC; --tinta:#2A2228; --rosa:#E2A6B0 }
  * { box-sizing:border-box; margin:0; padding:0; font-variant-numeric:lining-nums }
  html,body { width:390px; height:844px; overflow:hidden; background:var(--noche) }
  #stage { position:relative; width:390px; height:844px; overflow:hidden; font-family:Montserrat, sans-serif }
  .scene { position:absolute; inset:0; overflow:hidden }
  .cap { position:absolute; left:0; right:0; text-align:center; font-family:"Cormorant Garamond", serif; font-style:italic; font-weight:400; font-size:30px; line-height:1.15 }
  .lab { position:absolute; left:0; right:0; text-align:center; font-size:9.5px; letter-spacing:.42em; text-transform:uppercase }
  .kids { font-family:Fredoka, sans-serif; font-weight:700; font-size:84px; letter-spacing:.03em; color:var(--rosa); line-height:.9;
          text-shadow:0 1px 0 #fff, 0 4px 0 var(--oro), 0 16px 30px rgba(0,0,0,.35) }
  .mark { position:absolute; bottom:14px; left:0; right:0; text-align:center; font-size:8.5px; letter-spacing:.3em; color:#9A8F86; opacity:.7; z-index:9 }
</style></head>
<body><div id="stage"><div id="ui"></div><div class="mark">MAQUETA · FOTOS DE MUESTRA</div></div>
<script>
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const ease = (x) => 1 - Math.pow(1 - x, 3);
const inout = (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const rnd = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const fade = (t, a, b, f = .6) => Math.min(prog(t, a, a + f), 1 - prog(t, b - f, b));
const LOGO = '../inversionistas/logo-fuxia.svg', FOTO = (n) => `fotos-muestra/${n}.jpg`;
// Shoe-only crops of store photos (natural px): file, image w/h, crop centre and crop height (width follows the box).
const CROP = { doradas: [600, 900, 265, 470, 700], canutillos: [700, 700, 400, 575, 330], studpoint: [700, 700, 455, 565, 330], 'paula-gamuza': [700, 700, 330, 585, 300] };
function foto(n, x, y, w, h, clip) {
  const [iw, ih, cx, cy, ch] = CROP[n], cw = ch * w / h;
  return `<svg x="${x}" y="${y}" width="${w}" height="${h}" viewBox="${cx - cw / 2} ${cy - ch / 2} ${cw} ${ch}" preserveAspectRatio="xMidYMid slice"${clip ? ` clip-path="url(#${clip})"` : ''}><image href="${FOTO(n)}" width="${iw}" height="${ih}"/></svg>`;
}

// ── Figures (fashion-illustration silhouettes). Origin = between the feet; `w` = walk phase (radians), 0 = standing.
function mama(x, y, s, w, fill, handUp = false) {
  const a = Math.sin(w) * 15 * (w ? 1 : 0);
  const pierna = (dx, r) => `<g transform="translate(${dx} -74) rotate(${r})"><path d="M-2.5 0 L2.5 0 L1.5 70 L-1.1 70 Z"/><path d="M-1.4 69 L5.5 70.5 L5.8 73 L-1.6 73 Z"/><path d="M-1 70 L-1.6 76 L-0.2 76 L0.4 71 Z"/></g>`;
  return `<g transform="translate(${x} ${y}) scale(${s})" fill="${fill}">
    ${pierna(-3.5, a)}${pierna(3.5, -a)}
    <path d="M-12 -196 Q0 -202 12 -196 Q16 -158 13 -124 Q19 -100 27 -72 Q0 -65 -27 -72 Q-19 -100 -13 -124 Q-16 -158 -12 -196 Z"/>
    <path d="M-10 -192 Q-20 -160 -24 ${handUp ? -140 : -128} L-25 ${handUp ? -133 : -121}" stroke="${fill}" stroke-width="4.6" stroke-linecap="round" fill="none"/>
    <path d="M10 -192 Q18 -162 19 -134" stroke="${fill}" stroke-width="4.6" stroke-linecap="round" fill="none"/>
    <path d="M14 -138 L32 -138 L34 -122 L12 -122 Z"/><path d="M17 -138 Q23 -149 29 -138" stroke="${fill}" stroke-width="1.6" fill="none"/>
    <path d="M-2.8 -208 L2.8 -208 L3.4 -196 L-3.4 -196 Z"/>
    <ellipse cx="0" cy="-219" rx="8.6" ry="10.8"/><circle cx="7" cy="-214" r="4.8"/>
  </g>`;
}
function nina(x, y, s, w, fill, feet = null) {
  const a = Math.sin(w + Math.PI) * 18 * (w ? 1 : 0);
  const pierna = (dx, r) => `<g transform="translate(${dx} -46) rotate(${r})"><path d="M-2.1 0 L2.1 0 L1.4 44 L-1.2 44 Z"/><ellipse cx="1.8" cy="45" rx="5.4" ry="2.9" fill="${feet || fill}"/></g>`;
  return `<g transform="translate(${x} ${y}) scale(${s})" fill="${fill}">
    ${pierna(-3.6, a)}${pierna(3.6, -a)}
    <path d="M-7 -97 Q0 -100 7 -97 L8 -80 Q19 -62 23 -46 Q12 -41 0 -42 Q-12 -41 -23 -46 Q-19 -62 -8 -80 Z"/>
    <circle cx="-8" cy="-93" r="4.2"/><circle cx="8" cy="-93" r="4.2"/>
    <path d="M9 -92 Q17 -84 24 -74" stroke="${fill}" stroke-width="3.3" stroke-linecap="round" fill="none"/>
    <path d="M-9 -92 Q-14 -80 -14 -68" stroke="${fill}" stroke-width="3.3" stroke-linecap="round" fill="none"/>
    <path d="M-2.2 -106 L2.2 -106 L2.6 -97 L-2.6 -97 Z"/>
    <ellipse cx="0" cy="-116" rx="9.4" ry="10.2"/><circle cx="0" cy="-130" r="6"/><rect x="-5" y="-126" width="10" height="2" rx="1" fill="${feet ? feet : '#C9A86F'}" opacity=".9"/>
  </g>`;
}
function bailarina(x, y, s, fill, spin) {   // the reflection: en pointe, arms en couronne, tutu
  const sx = Math.cos(spin) * .25 + .75;
  return `<g transform="translate(${x} ${y}) scale(${s * sx} ${s})" fill="${fill}">
    <path d="M-1.5 0 L1.5 0 L2.6 -62 L-2.6 -62 Z"/>
    <path d="M1 -62 L14 -44 L3 -34" stroke="${fill}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M-38 -66 Q-30 -74 0 -76 Q30 -74 38 -66 Q30 -58 0 -58 Q-30 -58 -38 -66 Z" opacity=".92"/>
    <path d="M-7 -104 Q0 -108 7 -104 L6 -72 L-6 -72 Z"/>
    <path d="M-6 -102 Q-24 -122 -6 -140" stroke="${fill}" stroke-width="3.6" stroke-linecap="round" fill="none"/>
    <path d="M6 -102 Q24 -122 6 -140" stroke="${fill}" stroke-width="3.6" stroke-linecap="round" fill="none"/>
    <rect x="-2.4" y="-113" width="4.8" height="9" rx="2"/><circle cx="0" cy="-123" r="9.5"/><circle cx="0" cy="-136" r="5.5"/>
  </g>`;
}
function polvo(t, n, color, y0 = 0, y1 = 844, seed = 0) {
  let s = ''; for (let i = 0; i < n; i++) { const k = i + seed, x = rnd(k) * 390 + Math.sin(t * .5 + k) * 8, y = y1 - ((t * (6 + rnd(k + 9) * 12) + rnd(k + 3) * (y1 - y0)) % (y1 - y0));
    s += `<circle cx="${x}" cy="${y}" r="${.5 + rnd(k + 2) * 1.3}" fill="${color}" opacity="${.2 + .6 * Math.abs(Math.sin(t * (.7 + rnd(k + 5)) + k))}"/>`; }
  return s;
}
function destellos(cx, cy, p, r = 60, n = 10, color = '#E9D3A2') {
  if (p <= 0 || p >= 1) return ''; let s = '';
  for (let i = 0; i < n; i++) { const a = i / n * 6.283 + p * 1.5, d = ease(p) * r;
    s += `<path d="M0 -6 L1.4 -1.4 L6 0 L1.4 1.4 L0 6 L-1.4 1.4 L-6 0 L-1.4 -1.4 Z" fill="${color}" opacity="${1 - p}" transform="translate(${cx + Math.cos(a) * d} ${cy + Math.sin(a) * d}) scale(${1.2 - p})"/>`; }
  return s;
}

// ── Scene 1 · the street at dusk, the shop window glowing (0–10.2 s)
function calle(t) {
  const walk = prog(t, 1.2, 7.4), xs = -40 + inout(walk) * 205, w = walk > 0 && walk < 1 ? t * 7 : 0;
  const door = ease(prog(t, 7.2, 8.4)), zoom = 1 + 3.4 * inout(prog(t, 8, 10.2));
  const vitrina = (x, f, pos) => `<g><path d="M${x} 600 L${x} 470 Q${x} 420 ${x + 40} 420 Q${x + 80} 420 ${x + 80} 470 L${x + 80} 600 Z" fill="#F6E2B8"/>
      <clipPath id="c${x}"><path d="M${x + 6} 594 L${x + 6} 472 Q${x + 6} 428 ${x + 40} 428 Q${x + 74} 428 ${x + 74} 472 L${x + 74} 594 Z"/></clipPath>
      <g clip-path="url(#c${x})">${foto(f, x + 6, 428, 68, 166)}</g>
      <path d="M${x + 6} 594 L${x + 6} 472 Q${x + 6} 428 ${x + 40} 428 Q${x + 74} 428 ${x + 74} 472 L${x + 74} 594 Z" fill="url(#glow)" opacity=".45"/></g>`;
  let awn = ''; for (let i = 0; i < 9; i++) awn += `<path d="M${58 + i * 30.5} 330 L${88.5 + i * 30.5} 330 L${88.5 + i * 30.5} 352 Q${73 + i * 30.5} 366 ${58 + i * 30.5} 352 Z" fill="${i % 2 ? '#F3E7D3' : '#1E1B23'}"/>`;
  return `<svg class="scene" viewBox="0 0 390 844" style="opacity:${1 - prog(t, 9.6, 10.2)}">
    <defs><linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0F0E14"/><stop offset=".7" stop-color="#2A2330"/><stop offset="1" stop-color="#3A2E35"/></linearGradient>
      <radialGradient id="glow" cx=".5" cy=".6" r=".7"><stop offset="0" stop-color="#FFF4DA"/><stop offset="1" stop-color="#E9C88A" stop-opacity="0"/></radialGradient>
      <radialGradient id="luzPuerta" cx=".5" cy="1" r="1"><stop offset="0" stop-color="#FFF3D6" stop-opacity=".95"/><stop offset="1" stop-color="#FFF3D6" stop-opacity="0"/></radialGradient></defs>
    <g transform="translate(195 560) scale(${zoom}) translate(-195 -560)">
      <rect width="390" height="844" fill="url(#cielo)"/>
      ${polvo(t, 40, '#E9D3A2', 0, 640)}
      <rect x="40" y="250" width="310" height="390" fill="#1B1820"/>
      <rect x="40" y="250" width="310" height="390" fill="none" stroke="#3A3240" stroke-width="2"/>
      <rect x="70" y="268" width="250" height="46" fill="#121016"/>
      <image href="${LOGO}" x="105" y="276" width="180" height="31" style="filter:brightness(1.9) saturate(.8)"/>
      ${awn}
      ${vitrina(62, 'doradas')}${vitrina(248, 'canutillos')}
      <rect x="150" y="440" width="90" height="200" fill="#FFF1D0"/>
      <rect x="150" y="440" width="90" height="200" fill="url(#luzPuerta)"/>
      <rect x="150" y="440" width="${45 * (1 - door)}" height="200" fill="#2C2630" stroke="#C9A86F" stroke-width="1.2"/>
      <rect x="${240 - 45 * (1 - door)}" y="440" width="${45 * (1 - door)}" height="200" fill="#2C2630" stroke="#C9A86F" stroke-width="1.2"/>
      <path d="M150 440 Q195 400 240 440" fill="none" stroke="#C9A86F" stroke-width="1.5"/>
      <rect x="0" y="640" width="390" height="204" fill="#141218"/>
      <path d="M150 640 L240 640 L300 844 L90 844 Z" fill="#FFF1D0" opacity="${.12 + .2 * door}"/>
      ${mama(xs + 28, 690, .8, w, '#0B0A0E')}${nina(xs, 690, .8, w ? w : 0, '#0B0A0E')}
    </g>
    <rect width="390" height="844" fill="#FFF6E2" opacity="${prog(t, 9.4, 10.2)}"/>
  </svg>
  <div class="lab" style="top:130px;color:#C9A86F;opacity:${fade(t, .4, 6.8)}">Capítulo I</div>
  <div class="cap" style="top:150px;color:#F3E7D3;opacity:${fade(t, .6, 6.8)}">Una tarde, con mamá…</div>`;
}

// ── Scene 2 · inside: three arched niches, a trail of light to her pair (10–19 s)
function adentro(t) {
  const o = Math.min(prog(t, 10, 10.6), 1 - prog(t, 18.6, 19.2)); if (o <= 0) return '';
  const nicho = (x, f, i) => { const on = ease(prog(t, 11 + i * .5, 11.8 + i * .5)), elegido = i === 1 ? ease(prog(t, 13, 14)) : 0, baja = i === 1 ? inout(prog(t, 15, 17)) : 0;
    const img = `<g clip-path="url(#n${i})">${foto(f, x, 196, 90, 154)}</g>`;
    return `<clipPath id="n${i}"><path d="M${x} 350 L${x} 230 Q${x} 196 ${x + 45} 196 Q${x + 90} 196 ${x + 90} 230 L${x + 90} 350 Z"/></clipPath>
      <path d="M${x} 350 L${x} 230 Q${x} 196 ${x + 45} 196 Q${x + 90} 196 ${x + 90} 230 L${x + 90} 350 Z" fill="#EADBC4"/>
      <g opacity="${(.25 + .75 * on) * (1 - baja)}">${img}</g>
      <path d="M${x} 350 L${x} 230 Q${x} 196 ${x + 45} 196 Q${x + 90} 196 ${x + 90} 230 L${x + 90} 350 Z" fill="none" stroke="#C9A86F" stroke-width="${1.2 + elegido * 1.6}"/>
      <path d="M${x + 45} 160 L${x - 10} 360 L${x + 100} 360 Z" fill="#FFF6DF" opacity="${.18 * on + .35 * elegido}"/>`; };
  // the chosen pair floats down to her feet
  const b = inout(prog(t, 15, 17)), mx = 195, my = 273 + b * 330, ms = 1 - .72 * b;
  let trail = ''; for (let i = 0; i < 16; i++) { const k = i / 15, p = prog(t, 13.4 + k * 1.2, 13.9 + k * 1.2); if (p > 0)
    trail += `<circle cx="${195 + Math.sin(k * 7) * 26}" cy="${370 + k * 250}" r="${1.6 + 1.2 * Math.sin(k * 9 + t * 3) ** 2}" fill="#C9A86F" opacity="${p * (1 - prog(t, 16.5, 17.5))}"/>`; }
  const gold = prog(t, 17, 17.6);
  return `<svg class="scene" viewBox="0 0 390 844" style="opacity:${o}">
    <defs><linearGradient id="pared" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7EEDF"/><stop offset=".72" stop-color="#EFE0C9"/><stop offset=".72" stop-color="#E4D2B6"/><stop offset="1" stop-color="#D9C3A2"/></linearGradient></defs>
    <rect width="390" height="844" fill="url(#pared)"/>
    <path d="M30 380 L360 380" stroke="#C9A86F" stroke-width="1"/>
    ${nicho(10, 'studpoint', 0)}${nicho(150, 'doradas', 1)}${nicho(290, 'paula-gamuza', 2)}
    ${polvo(t, 30, '#C9A86F', 150, 800, 50)}
    ${trail}
    ${b > 0 && b < 1 ? `<g transform="translate(${mx} ${my}) scale(${ms})"><clipPath id="vuelo"><circle r="44"/></clipPath><circle r="47" fill="#fff" stroke="#C9A86F"/>${foto('doradas', -44, -44, 88, 88, 'vuelo')}</g>` : ''}
    <ellipse cx="200" cy="742" rx="90" ry="9" fill="#B89E7A" opacity=".35"/>
    ${mama(246, 742, 1.12, 0, '#2A2228', true)}
    ${nina(168, 742, 1.3, 0, '#2A2228', gold ? `rgb(${42 + 159 * gold},${34 + 134 * gold},${40 + 71 * gold})` : null)}
    ${destellos(170, 738, prog(t, 17, 18.2), 52)}${destellos(170, 738, prog(t, 17.5, 18.6), 30, 8)}
  </svg>
  <div class="lab" style="top:110px;color:#8A7351;opacity:${fade(t, 10.6, 18.4)}">Capítulo II</div>
  <div class="cap" style="top:128px;color:#2A2228;font-size:27px;opacity:${fade(t, 10.8, 14.6)}">Entre todas, una brilla para ella</div>
  <div class="cap" style="top:128px;color:#2A2228;font-size:27px;opacity:${fade(t, 15, 18.4)}">Sus primeras ballerinas</div>`;
}

// ── Scene 3 · the mirror: her reflection is a ballerina (19–25.6 s)
function espejo(t) {
  const o = Math.min(prog(t, 19, 19.6), 1 - prog(t, 25, 25.6)); if (o <= 0) return '';
  const r = ease(prog(t, 20.4, 22.4)), spin = (t - 20.4) * 2.2;
  return `<svg class="scene" viewBox="0 0 390 844" style="opacity:${o}">
    <defs><radialGradient id="cuarto" cx=".5" cy=".42" r=".8"><stop offset="0" stop-color="#3A3038"/><stop offset="1" stop-color="#141117"/></radialGradient>
      <radialGradient id="vidrio" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#FFF7E6"/><stop offset="1" stop-color="#E8D3AE"/></radialGradient>
      <clipPath id="oval"><ellipse cx="195" cy="390" rx="118" ry="176"/></clipPath></defs>
    <rect width="390" height="844" fill="url(#cuarto)"/>
    <ellipse cx="195" cy="390" rx="132" ry="190" fill="none" stroke="#C9A86F" stroke-width="5"/>
    <ellipse cx="195" cy="390" rx="124" ry="182" fill="none" stroke="#E9D3A2" stroke-width="1"/>
    <ellipse cx="195" cy="390" rx="118" ry="176" fill="url(#vidrio)"/>
    <g clip-path="url(#oval)">
      <g opacity="${1 - r}">${nina(195, 520, 1.5, 0, '#2A2228', '#C9A86F')}</g>
      <g opacity="${r}">${bailarina(195, 528, 1.45, '#B8935A', spin)}</g>
      ${destellos(195, 360, prog(t, 20.6, 22.2), 100, 14, '#C9A86F')}${destellos(195, 420, prog(t, 21.4, 23), 80, 10, '#C9A86F')}
      ${polvo(t, 26, '#C9A86F', 220, 570, 90)}
    </g>
    <g opacity=".95">${nina(195, 790, 1.25, 0, '#0B0A0E', '#C9A86F')}</g>
  </svg>
  <div class="lab" style="top:70px;color:#C9A86F;opacity:${fade(t, 19.4, 25.2)}">Capítulo III</div>
  <div class="cap" style="top:88px;color:#F3E7D3;font-size:27px;opacity:${fade(t, 22.2, 25.2)}">…y por primera vez, se vio bailarina</div>`;
}

// ── Close (25.4–31 s)
function cierre(t) {
  const o = prog(t, 25.4, 26.2); if (o <= 0) return '';
  const s = 1 + 1.5 * Math.pow(1 - ease(prog(t, 25.8, 26.8)), 2) * 0 + (ease(prog(t, 25.8, 26.8)) < 1 ? 0 : 0);
  const k = ease(prog(t, 25.9, 26.9));
  return `<div class="scene" style="background:radial-gradient(circle at 50% 45%, #2B2430, #141117);opacity:${o}">
    <svg class="scene" viewBox="0 0 390 844">${polvo(t, 40, '#E9D3A2')}</svg>
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center">
      <img src="${LOGO}" style="width:200px;filter:brightness(1.9) saturate(.8);opacity:${prog(t, 25.6, 26.4)}">
      <div style="height:18px"></div>
      <div class="kids" style="opacity:${k};transform:scale(${.85 + .15 * k})">KIDS</div>
      <div style="width:${50 * prog(t, 26.8, 27.6)}px;height:1px;background:#C9A86F;margin:26px auto 18px"></div>
      <div style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:24px;color:#F3E7D3;opacity:${prog(t, 27.2, 28)}">Su primer par</div>
      <div style="margin-top:14px;font-size:9.5px;letter-spacing:.42em;color:#C9A86F;opacity:${prog(t, 27.8, 28.6)}">MUY PRONTO · FUXIABALLERINAS.COM</div>
    </div></div>`;
}

function render(t) { document.getElementById('ui').innerHTML = calle(t) + adentro(t) + espejo(t) + cierre(t); }
window.render = render; window.DURATION = 31; window.STILLS = [4, 8.8, 12.5, 16, 17.9, 23.4, 29.5];
render(+(new URLSearchParams(location.search).get('t') || 4));
</script></body></html>
