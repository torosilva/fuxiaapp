const SEQS = [];
function seq(name, css, tin, tout, srcFrom, rate = 1, fx = 'pop') { const d = el('<img style="width:100%;display:block">', css, tin, tout, fx); SEQS.push({ name, d, tin, tout, srcFrom, rate }); return d; }
function frameAt(list, t) { let lo = 0, hi = list.length - 1; while (lo < hi) { const m = (lo + hi + 1) >> 1; if (list[m][0] <= t) lo = m; else hi = m - 1; } return list[lo][1]; }
async function render(t) {
  for (const o of E) {
    const k = ease((t - o.tin) / .6), out = o.tout ? ease((t - o.tout) / .45) : 0, a = Math.max(0, k - out);

  document.getElementById('tag').style.opacity = chap.style.opacity;
  const waits = [];
  for (const s of SEQS) { if (t < s.tin - .1 || t > s.tout + .6) continue; const list = (window.SEQ || {})[s.name]; if (!list) continue;
    const img = s.d.firstChild, url = frameAt(list, s.srcFrom + Math.max(0, t - s.tin) * s.rate); if (img.getAttribute('src') !== url) { img.src = url; waits.push(img.decode().catch(() => {})); } }
