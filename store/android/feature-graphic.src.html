<!doctype html><meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1024px;height:500px;overflow:hidden}
  body{background:#0D0D0D;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;position:relative}

  .shot{position:absolute;right:0;top:0;bottom:0;width:600px;overflow:hidden}
  .shot img{display:block;width:100%;height:100%;object-fit:cover;object-position:58% 45%}
  .warm{position:absolute;inset:0;background:rgba(184,134,11,.12);mix-blend-mode:overlay}
  /* fundido largo hacia la izquierda: elimina el borde duro */
  .fade{position:absolute;inset:0;
    background:linear-gradient(90deg,
      #0D0D0D 0%, rgba(13,13,13,.97) 18%, rgba(13,13,13,.72) 40%,
      rgba(13,13,13,.34) 66%, rgba(13,13,13,.18) 100%)}
  /* viñeta arriba/abajo para que no corte plano */
  .vig{position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(13,13,13,.55) 0%,transparent 18%,transparent 82%,rgba(13,13,13,.55) 100%)}

  .hairline{position:absolute;left:0;right:0;top:0;height:3px;z-index:3;
    background:linear-gradient(90deg,transparent,#B8860B 30%,#E8C170 50%,#B8860B 70%,transparent)}

  .wrap{position:relative;z-index:2;height:100%;
    display:flex;flex-direction:column;justify-content:center;padding:0 0 0 88px;max-width:600px}
  .logo{width:400px;height:auto;display:block;margin-bottom:32px}
  .tag{color:#F7F3EA;font-size:42px;line-height:1.15;font-weight:600;letter-spacing:-.5px;
    text-shadow:0 2px 20px rgba(0,0,0,.85)}
  .tag b{color:#E8C170;font-weight:700}
  .sub{margin-top:20px;color:rgba(247,243,234,.7);font-size:20px;
    text-shadow:0 2px 14px rgba(0,0,0,.9)}
  .rule{width:64px;height:3px;background:#B8860B;margin-top:28px;border-radius:2px}
</style>
